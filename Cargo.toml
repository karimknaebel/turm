[package]
name = "turm"
version = "0.16.0"
authors = ["Karim Knaebel <contact@knaebel.dev>"]
description = "A TUI for the Slurm Workload Manager."
repository = "https://github.com/karimknaebel/turm"
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.40", features = ["derive", "env"] }
clap_complete = "4.5.54"
crossbeam = "0.8.4"
crossterm = "0.29.0"
itertools = "0.14.0"
nix = { version = "0.31.3", features = ["process", "signal", "term"] }
notify = "8.0.0"
ratatui = "0.30.0"
regex = "1.11.1"
shell-words = "1.1.1"
# Share crossterm's signal-hook 0.3 dependency; revisit when upgrading crossterm.
signal-hook = "0.3.18"
tui-input = { version = "0.14.0", default-features = false, features = ["crossterm"] }
